wake_word:
  model: hey_jarvis
  threshold: 0.5
  chunk_size: 1280
stt:
  model: small
  device: cuda
  compute_type: int8
llm:
  active_provider: claude
  temperature: 0.7
  providers:
    claude:
      type: claude_agent
      label: Claude (subscription)
      model: claude-sonnet-5-5
      max_turns: 15
    ollama:
      type: ollama
      label: Ollama (Local)
      model: qwen3:4b-q4_K_M
      base_url: http://localhost:11434
      think: false
      keep_alive: 30m      # stays in GPU memory this long after the last use (~3.3 GB)
brain:
  daily_claude_budget: 100
  warn_at_percent: 80
  usage_db: data/usage.db
  limit_backoff_minutes: 15
  error_backoff_minutes: 2
  backup_keep_alive: 5m
  min_free_vram_gb_for_backup: 4
  est_limit_5h_requests: null
  est_limit_7d_requests: null
desktop:
  backend: windows_mcp
  command: uvx
  start_timeout_s: 120
  windows_mcp_tools:
  - Snapshot
  - Click
  - Type
  - Scroll
  - Move
  - Shortcut
  - Wait
  - WaitFor
  - App
  - PowerShell
browser:
  enabled: true
  channel: chrome
  search_engine: duckduckgo
  profile_dir: data/chrome-profile
  max_chars: 6000
  max_elements: 60
  page_cache_minutes: 30
decision:
  provider: rules
  local_for_simple: false      # "fast mode": chat / quick questions answered by the local brain
                               # (~1.5-2 s), tasks still on Claude. Say "fast mode on" / "fast mode off".
  thresholds:
    unclear: 0.7
    needs_plan: 0.5
    claude_complexity: 5
cache:
  db: data/cache.db
  answers:
    enabled: true
    ttl_days: 7
context:
  max_messages: 10
  summarize_after: 8
  max_tokens: 2500
voice:
  always_listening: true       # no wake word: everything you say is a request. "stop listening"
                               # pauses; then "Jarvis, ..." wakes it. false = say "Hey Jarvis" first.
  wake_reply: chime            # chime (instant) | yes (spoken "Yes?")
  end_silence_ms: 700          # how long you pause before Jarvis treats it as the end of your sentence
  first_listen_seconds: 6      # after the wake word: give up if you don't start talking by then
  conversation_idle_seconds: 300   # after a reply the conversation stays open (no wake word) until
                                   # it's been quiet this long, or "that's all" (0 = off)
tts:
  voice: af_heart
  speed: 1.1
memory:
  db_path: jarvis/data/memory.db
  chroma_path: jarvis/data/chroma
  top_k: 3
tools:
  allowed_paths:
  - ~/Documents
  - ~/Desktop
  - ~/Downloads
  code_timeout: 10
security:
  blocked_paths:
  - C:/Windows
  - C:/Program Files
  - C:/Program Files (x86)
  - C:/ProgramData
  - ~/AppData/Roaming/Microsoft/Credentials
  - ~/AppData/Local/Microsoft/Credentials
  - ~/AppData/Roaming/Microsoft/Protect
  untrusted_tools:
  - web_search
  - fetch_page
  - read_screen
  - find_on_screen
  - get_clipboard
  - win_snapshot
  - win_waitfor
  - browser_read
  - browser_search
  max_denials_per_turn: 2
  audit_db: data/audit.db
  confirm_timeout_s: 30
  elevation_max_minutes: 15
