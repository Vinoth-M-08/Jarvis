wake_word:
  model: hey_jarvis
  threshold: 0.5
  chunk_size: 1280
stt:
  model: small
  device: cuda
  compute_type: int8
llm:
  active_provider: claude
  temperature: 0.7
  providers:
    claude:
      type: claude_agent
      label: Claude (subscription)
      model: claude-opus-5-5
      max_turns: 15
    ollama:
      type: ollama
      label: Ollama (Local)
      model: qwen3:4b
      base_url: http://localhost:11434
      think: false
brain:
  daily_claude_budget: 100
  warn_at_percent: 80
  usage_db: data/usage.db
cache:
  db: data/cache.db
  answers:
    enabled: true
    ttl_days: 7
context:
  max_messages: 10
  summarize_after: 8
  max_tokens: 2500
tts:
  voice: af_heart
  speed: 1.1
memory:
  db_path: jarvis/data/memory.db
  chroma_path: jarvis/data/chroma
  top_k: 3
tools:
  allowed_paths:
  - ~/Documents
  - ~/Desktop
  - ~/Downloads
  code_timeout: 10
security:
  blocked_paths:
  - C:/Windows
  - C:/Program Files
  - C:/Program Files (x86)
  - C:/ProgramData
  - ~/AppData/Roaming/Microsoft/Credentials
  - ~/AppData/Local/Microsoft/Credentials
  - ~/AppData/Roaming/Microsoft/Protect
  untrusted_tools:
  - web_search
  - fetch_page
  - read_screen
  - find_on_screen
  - get_clipboard
  max_denials_per_turn: 2
  audit_db: data/audit.db
  confirm_timeout_s: 30
  elevation_max_minutes: 15
